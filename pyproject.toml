[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "firebase-admin>=6.6,<7.0",
    "PyJWT>=2.10,<3.0",
    "google-cloud-storage>=2.18,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "aio-pika>=9.5,<10.0",
    "pymupdf>=1.24,<2.0",
    "pillow>=11.0,<12.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.11,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
